# Admin-enforced Codex requirements for Aegis ATV.
# This is the correct enterprise surface for managed hooks.

allowed_approval_policies = ["on-request"]
allowed_sandbox_modes = ["read-only", "workspace-write"]

[features]
codex_hooks = true

[hooks]
managed_dir = "/Users/chanikpark/Documents/aegis_atv_codex_mvp/deployment/codex"

[[hooks.SessionStart]]
matcher = "startup|resume|clear"
[[hooks.SessionStart.hooks]]
type = "command"
command = "/bin/zsh /Users/chanikpark/Documents/aegis_atv_codex_mvp/deployment/codex/run-hook.sh"
timeout = 30
statusMessage = "Aegis ATV session check"

